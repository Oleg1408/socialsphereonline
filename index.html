<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Sphere</title>
<style>
  /* Общие стили */
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }
  /* Фон видео */
  .video-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
  }
  /* Затемнение */
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 0;
  }
  /* Контент */
  .content {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    text-align: center;
    padding: 0 20px;
  }
  h1 {
    font-size: 2.5em;
    margin-bottom: 0.5em;
  }
  p {
    font-size: 1.2em;
    margin-bottom: 1.5em;
  }
  .cta-btn {
    background-color: #ff5a5f;
    color: #fff;
    font-size: 1.3em;
    padding: 15px 30px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
  }
  .cta-btn:hover {
    background-color: #e14c50;
  }
</style>
</head>
<body>

<!-- Фоновое видео -->
<video class="video-bg" autoplay muted loop playsinline>
  <source src="https://player.vimeo.com/external/349504951.sd.mp4?s=5a75f1e144dfd04ab7903c47c2345c18e16e9f13&profile_id=164&oauth2_token_id=57447761" type="video/mp4">
</video>

<!-- Затемнение -->
<div class="overlay"></div>

<!-- Контент -->
<div class="content">
  <h1>Connect with people around you</h1>
  <p>Chat, make friends, and discover new people nearby</p>
  <a href="https://trk.cloudsecure-dt.com/?a=291369&c=405908" class="cta-btn">Start Chatting</a>
</div>

</body>
</html>
