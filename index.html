<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Social Sphere</title>

<!-- Google tag -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-H2DNL0SX0P"></script>

<script>
window.dataLayer = window.dataLayer || [];

function gtag(){
    dataLayer.push(arguments);
}

gtag('js', new Date());

gtag('config', 'G-H2DNL0SX0P');
</script>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:Arial,sans-serif;

    background:#000;

}


/* VIDEO */

.video-bg{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;


    object-fit:cover;


    /*
    Главная настройка кадра.
    50% = центр.
    35% = чуть выше,
    чтобы человек был виден.
    */

    object-position:center 35%;


    z-index:-2;


}



/* Затемнение */

.overlay{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.25);

    z-index:-1;

}



/* CONTENT */

.content{

    position:relative;

    width:100%;
    height:100%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    color:white;

    padding:20px;

}



h1{

    font-size:2.6rem;

    margin-bottom:15px;

    font-weight:700;

}



p{

    font-size:1.2rem;

    margin-bottom:30px;

}



.cta-btn{

    background:#ff5a5f;

    color:white;

    padding:16px 34px;

    border-radius:10px;

    text-decoration:none;

    font-size:1.3rem;

    font-weight:bold;

    box-shadow:0 8px 25px rgba(0,0,0,.35);

}



.cta-btn:hover{

    background:#e14c50;

}



/* MOBILE */

@media(max-width:768px){


.video-bg{

    object-position:center 30%;

}


h1{

    font-size:2rem;

}


p{

    font-size:1rem;

}


.cta-btn{

    font-size:1.1rem;

    padding:15px 30px;

}


}


</style>

</head>


<body>


<video 
class="video-bg"

autoplay

muted

loop

playsinline

webkit-playsinline

preload="auto">

<source src="video.mp4" type="video/mp4">

</video>



<div class="overlay"></div>



<div class="content">


<h1>
Meet Someone Tonight
</h1>


<p>
Unlock your story
</p>


<a id="ctaButton" href="#" class="cta-btn">
Continue
</a>


</div>



<script>


const offerLink =
"https://t.datsk11.com/396873/7346?aff_sub5=SF_006OG000004lmDN";


const btn =
document.getElementById("ctaButton");



btn.href = offerLink;



btn.addEventListener("click",function(e){


e.preventDefault();



if(typeof gtag==="function"){


gtag("event","continue_click",{


event_category:"CTA",

event_label:"Continue Button"


});


}



setTimeout(function(){


window.location.href = offerLink;


},250);



});



</script>



</body>
</html>
