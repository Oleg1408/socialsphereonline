<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Sphere</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-H2DNL0SX0P"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-H2DNL0SX0P');
</script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#000;
}

/* ===========================
   VIDEO BACKGROUND
=========================== */

.video-wrapper{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
    z-index:-3;
}

/* Размытая копия */
.video-blur{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center center;

    transform:scale(1.25);

    filter:blur(30px);

    opacity:.75;

    z-index:0;
}

/* Основное видео */
.video-main{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;
    object-position:center center;

    z-index:1;
}

/* Затемнение */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    z-index:-1;
}

/* ===========================
   CONTENT
=========================== */

.content{

    position:relative;

    width:100%;
    height:100%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    color:#fff;

    padding:20px;

}

h1{

    font-size:2.6rem;

    margin-bottom:.4em;

    font-weight:700;

}

p{

    font-size:1.2rem;

    margin-bottom:1.6em;

    max-width:500px;

}

.cta-btn{

    display:inline-block;

    background:#ff5a5f;

    color:#fff;

    font-size:1.3rem;

    padding:16px 34px;

    border-radius:10px;

    text-decoration:none;

    font-weight:bold;

    box-shadow:0 8px 25px rgba(0,0,0,.45);

    transition:.25s;

}

.cta-btn:hover{

    background:#e14c50;

    transform:scale(1.05);

}

/* ===========================
   MOBILE
=========================== */

@media (max-width:768px){

    h1{
        font-size:2rem;
    }

    p{
        font-size:1rem;
    }

    .cta-btn{

        font-size:1.1rem;

        padding:15px 30px;

    }

}

</style>

</head>

<body>

<div class="video-wrapper">

    <!-- Размытый фон -->

    <video class="video-blur" autoplay muted loop playsinline preload="auto">
        <source src="video.mp4" type="video/mp4">
    </video>

    <!-- Основное видео -->

    <video class="video-main" autoplay muted loop playsinline preload="auto">
        <source src="video.mp4" type="video/mp4">
    </video>

</div>

<div class="overlay"></div>

<div class="content">

    <h1>Meet Someone Tonight</h1>

    <p>Unlock your story</p>

    <a id="ctaButton" href="#" class="cta-btn">
        Continue
    </a>

</div>

<script>

const offerLink = "https://t.datsk11.com/396873/7346?aff_sub5=SF_006OG000004lmDN";

const btn = document.getElementById("ctaButton");

btn.href = offerLink;

btn.addEventListener("click", function(e){

    e.preventDefault();

    if(typeof gtag === "function"){

        gtag("event","continue_click",{

            event_category:"CTA",

            event_label:"Continue Button"

        });

    }

    setTimeout(function(){

        window.location.href = offerLink;

    },250);

});

</script>

</body>
</html>
