<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Social Sphere</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-H2DNL0SX0P"></script>

<script>
window.dataLayer = window.dataLayer || [];

function gtag(){
    dataLayer.push(arguments);
}

gtag('js', new Date());

gtag('config', 'G-H2DNL0SX0P');
</script>


<style>

body, html{

    margin:0;

    padding:0;

    height:100%;

    font-family:Arial,sans-serif;

    overflow:hidden;

}


/* Фоновое видео */

.video-bg{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;


    object-fit:cover;


    object-position:center 40%;


    z-index:-1;


    filter:blur(3px);


    transform:scale(1);

}



/* Затемнение */

.overlay{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;


    background:rgba(0,0,0,0.30);


    z-index:0;

}



/* Контент */

.content{

    position:relative;

    z-index:1;


    height:100%;


    display:flex;

    flex-direction:column;


    justify-content:center;


    align-items:center;


    color:#fff;


    text-align:center;


    padding:0 20px;

}



h1{

    font-size:2.6em;

    margin-bottom:0.4em;

    font-weight:700;

}



p{

    font-size:1.2em;

    margin-bottom:1.6em;

    max-width:500px;

}


/* Online indicator */

.online-status{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    font-size:1.05em;

    margin-top:-0.7em;

    margin-bottom:1.6em;

}



.online-dot{

    width:9px;

    height:9px;

    background:#35d05f;

    border-radius:50%;

    display:inline-block;

    box-shadow:0 0 8px rgba(53,208,95,0.8);

    animation:pulse 1.8s infinite;

}



@keyframes pulse{

    0%,100%{

        opacity:1;

        transform:scale(1);

    }

    50%{

        opacity:0.65;

        transform:scale(0.88);

    }

}



.cta-btn{

    background:#ff5a5f;

    color:#fff;


    font-size:1.3em;


    padding:16px 34px;


    border:none;


    border-radius:10px;


    cursor:pointer;


    text-decoration:none;


    font-weight:bold;


    box-shadow:0 8px 25px rgba(0,0,0,0.4);

}



.cta-btn:hover{

    background:#e14c50;

}



/* Мобильные устройства */

@media(max-width:768px){


.video-bg{


    /*
    Чуть больше показывает верх кадра
    без уменьшения видео
    */

    object-position:center 35%;


    transform:scale(1);


}



h1{

    font-size:2.2em;

}



p{

    font-size:1.05em;

    padding:0 10px;

}



.cta-btn{

    font-size:1.15em;

    padding:15px 30px;

}


}



</style>


</head>


<body>



<video 
class="video-bg" 
autoplay 
muted 
loop 
playsinline
webkit-playsinline>

<source src="video.mp4" type="video/mp4">

</video>



<div class="overlay"></div>



<div class="content">


<h1>
Meet Someone Tonight
</h1>


<p>
Singles looking for something more
</p>


<div class="online-status">

<span class="online-dot"></span>

<span id="onlineCount">37 women online now</span>

</div>


<a id="ctaButton" href="#" class="cta-btn">

See Who's Online

</a>


</div>



<script>


const offerLink = "https://t.datsk11.com/396873/7346?aff_sub5=SF_006OG000004lmDN";


const btn = document.getElementById("ctaButton");


btn.href = offerLink;



btn.addEventListener("click", function(e){


    e.preventDefault();


    if(typeof gtag === "function"){


        gtag("event","continue_click",{


            event_category:"CTA",

            event_label:"See Who's Online Button"


        });


    }



    setTimeout(function(){


        window.location.href = offerLink;


    },250);



});



/* Динамический online-счётчик */

const onlineCount = document.getElementById("onlineCount");

/*
   При каждом новом открытии страницы
   стартовое значение случайное: 10–115
*/

let currentCount = Math.floor(Math.random() * 106) + 10;


/*
   Сразу показываем новое значение,
   чтобы 37 не появлялось даже на мгновение
*/

onlineCount.textContent = currentCount + " women online now";


function updateOnlineCount(){

    /*
       Случайное изменение от -5 до +5
    */

    const change = Math.floor(Math.random() * 11) - 5;

    currentCount += change;


    /*
       Минимум — 10
       Максимум — 115
    */

    if(currentCount < 10){

        currentCount = 10;

    }


    if(currentCount > 115){

        currentCount = 115;

    }


    onlineCount.textContent = currentCount + " women online now";

}


setInterval(updateOnlineCount, 10000);


</script>



</body>

</html>
