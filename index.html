<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Social Sphere</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-H2DNL0SX0P"></script>

<script>
window.dataLayer = window.dataLayer || [];

function gtag(){
    dataLayer.push(arguments);
}

gtag('js', new Date());

gtag('config', 'G-H2DNL0SX0P');
</script>


<style>

body, html{

    margin:0;
    padding:0;

    height:100%;

    font-family:Arial,sans-serif;

    overflow:hidden;

}


/* Фоновое видео */

.video-bg{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;


    object-fit:cover;


    object-position:center 40%;


    z-index:-1;


    filter:blur(3px);


    transform:scale(1);

}



/* Затемнение */

.overlay{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;


    background:rgba(0,0,0,0.30);


    z-index:0;

}



/* Контент */

.content{

    position:relative;

    z-index:1;


    height:100%;


    display:flex;

    flex-direction:column;


    justify-content:center;


    align-items:center;


    color:#fff;


    text-align:center;


    padding:0 20px;

}



h1{

    font-size:2.6em;

    margin-bottom:0.4em;

    font-weight:700;

}



p{

    font-size:1.2em;

    margin-bottom:1.6em;

    max-width:500px;

}



.cta-btn{

    background:#ff5a5f;

    color:#fff;


    font-size:1.3em;


    padding:16px 34px;


    border:none;


    border-radius:10px;


    cursor:pointer;


    text-decoration:none;


    font-weight:bold;


    box-shadow:0 8px 25px rgba(0,0,0,0.4);

}



.cta-btn:hover{

    background:#e14c50;

}



/* Мобильные устройства */

@media(max-width:768px){


.video-bg{


    /*
    Чуть больше показывает верх кадра
    без уменьшения видео
    */

    object-position:center 35%;


    transform:scale(1);


}



h1{

    font-size:2.2em;

}



p{

    font-size:1.05em;

    padding:0 10px;

}



.cta-btn{

    font-size:1.15em;

    padding:15px 30px;

}


}



</style>


</head>


<body>



<video 
class="video-bg" 
autoplay 
muted 
loop 
playsinline
webkit-playsinline>

<source src="video.mp4" type="video/mp4">

</video>



<div class="overlay"></div>



<div class="content">


<h1>
Meet Someone Tonight
</h1>


<p>
Unlock your story
</p>


<a id="ctaButton" href="#" class="cta-btn">

Continue

</a>


</div>



<script>


const offerLink = "https://t.datsk11.com/396873/7346?aff_sub5=SF_006OG000004lmDN";


const btn = document.getElementById("ctaButton");


btn.href = offerLink;



btn.addEventListener("click", function(e){


    e.preventDefault();


    if(typeof gtag === "function"){


        gtag("event","continue_click",{


            event_category:"CTA",

            event_label:"Continue Button"


        });


    }



    setTimeout(function(){


        window.location.href = offerLink;


    },250);



});


</script>



</body>

</html>
